
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOLLAR PRINTER</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b10;color:#f4f6fa;font-family:Arial,sans-serif}
header{padding:18px 14px;background:#10151e;border-bottom:1px solid #29313e;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:20px;font-weight:900;letter-spacing:1px}
.brand span{color:#18d69a}
.demo{font-size:11px;color:#18d69a;border:1px solid #18d69a;padding:5px 8px;border-radius:5px}
main{padding:12px;max-width:850px;margin:auto}
.panel{background:#111720;border:1px solid #26303c;border-radius:10px;padding:13px;margin-bottom:12px}
.muted{color:#98a5b6;font-size:12px}
.balance{font-size:27px;font-weight:bold;margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
select,input,button{background:#1b2430;color:white;border:1px solid #364353;border-radius:6px;padding:10px;font-size:14px}
button{cursor:pointer}
button:active{opacity:.7}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tools button{padding:7px 11px;font-size:12px}
.tools button.active{border-color:#18d69a;color:#18d69a}
#chart{width:100%;height:270px;display:block;background:#0b1017;border-radius:6px}
.price{font-size:22px;font-weight:bold}
.green{color:#18d69a}
.red{color:#ff5265}
label{display:block;color:#98a5b6;font-size:12px;margin:12px 0 6px}
input,select{width:100%}
.tradebuttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tradebuttons button{font-size:16px;font-weight:bold;padding:15px;border:0}
.buy{background:#087f60}
.sell{background:#c52f45}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;font-size:12px}
.item{padding:10px 0;border-bottom:1px solid #29313e;font-size:13px}
.item:last-child{border:0}
footer{text-align:center;color:#8490a0;font-size:11px;padding:18px}
</style>
</head>
<body>
<header>
<div class="brand">DOLLAR <span>PRINTER</span></div>
<div class="demo">DEMO ACCOUNT</div>
</header>
<main>
<section class="panel">
<div class="row">
<div>
<div class="muted">DEMO BALANCE (USD)</div>
<div class="balance" id="balance">$1,000.00</div>
</div>
<button onclick="resetDemo()">Reset</button>
</div>
</section>

<section class="panel">
<div class="row">
<select id="symbol" onchange="newMarket()">
<option>EUR/USD</option>
<option>GBP/USD</option>
<option>USD/JPY</option>
<option>XAU/USD</option>
<option>BTC/USD</option>
</select>
<div>
<div class="muted">SIMULATED PRICE</div>
<div class="price" id="price">1.08500</div>
</div>
</div>
<div class="tools">
<button class="active" onclick="setTF('M1',this)">M1</button>
<button onclick="setTF('M5',this)">M5</button>
<button onclick="setTF('M15',this)">M15</button>
<button onclick="setTF('M30',this)">M30</button>
<button onclick="setTF('H1',this)">H1</button>
</div>
<canvas id="chart"></canvas>
<div class="muted" style="margin-top:9px">Illustrative demo chart. Prices are simulated, not live market quotes.</div>
</section>

<section class="panel">
<div class="row"><strong>Place Demo Trade</strong><span class="muted">BUY / SELL</span></div>
<label for="amount">Trade amount (USD)</label>
<input id="amount" type="number" min="1" step="1" value="10">
<div class="tradebuttons">
<button class="buy" onclick="trade('BUY')">BUY ▲</button>
<button class="sell" onclick="trade('SELL')">SELL ▼</button>
</div>
<div class="muted" id="message" style="margin-top:10px">Demo trading only. No real money is used.</div>
</section>

<section class="panel">
<div class="tabs">
<button onclick="showTab('positions')">Open Positions</button>
<button onclick="showTab('history')">History</button>
</div>
<div id="list"></div>
</section>
</main>
<footer>DOLLAR PRINTER · DEMO MODE · No real-money execution</footer>

<script>
let balance=1000;
let positions=[];
let history=[];
let currentTF='M1';
let tab='positions';
let seq=0;
let prices={
'EUR/USD':1.08500,
'GBP/USD':1.27100,
'USD/JPY':149.500,
'XAU/USD':2700.00,
'BTC/USD':67000.00
};
let price=prices['EUR/USD'];
let candles=[];

function fmt(n){
 return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function decimals(){
 return document.getElementById('symbol').value==='USD/JPY'?3:
 document.getElementById('symbol').value==='XAU/USD'?2:
 document.getElementById('symbol').value==='BTC/USD'?2:5;
}
function makeCandles(){
 candles=[];
 let p=price;
 for(let i=0;i<45;i++){
  let open=p;
  let change=(Math.random()-.49)*p*.0018;
  let close=open+change;
  candles.push({
   open,close,
   high:Math.max(open,close)+Math.random()*p*.0005,
   low:Math.min(open,close)-Math.random()*p*.0005
  });
  p=close;
 }
 price=p;
}
function newMarket(){
 price=prices[document.getElementById('symbol').value];
 makeCandles(); update(); draw();
}
function setTF(tf,btn){
 currentTF=tf;
 document.querySelectorAll('.tools button').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
 makeCandles();update();draw();
}
function update(){
 document.getElementById('balance').textContent='$'+fmt(balance);
 document.getElementById('price').textContent=price.toFixed(decimals());
 renderList();
}
function draw(){
 const canvas=document.getElementById('chart');
 const rect=canvas.getBoundingClientRect();
 if(!rect.width)return;
 const dpr=window.devicePixelRatio||1;
 canvas.width=rect.width*dpr;
 canvas.height=270*dpr;
 const ctx=canvas.getContext('2d');
 ctx.scale(dpr,dpr);
 const w=rect.width,h=270;
 ctx.fillStyle='#0b1017';ctx.fillRect(0,0,w,h);
 let min=Math.min(...candles.map(c=>c.low));
 let max=Math.max(...candles.map(c=>c.high));
 let pad=(max-min)*.12||.01;min-=pad;max+=pad;
 const y=v=>h-20-(v-min)/(max-min)*(h-40);
 ctx.font='10px Arial';
 for(let i=0;i<5;i++){
  let yy=20+i*(h-40)/4;
  ctx.strokeStyle='#202a36';ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(w,yy);ctx.stroke();
  let val=max-i*(max-min)/4;
  ctx.fillStyle='#8190a2';
  ctx.fillText(val.toFixed(decimals()),5,yy-4);
 }
 const left=62, right=8, usable=w-left-right;
 const step=usable/candles.length;
 candles.forEach((c,i)=>{
  const x=left+i*step+step/2;
  const up=c.close>=c.open;
  const color=up?'#18d69a':'#ff5265';
  ctx.strokeStyle=color;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x,y(c.high));ctx.lineTo(x,y(c.low));ctx.stroke();
  ctx.fillStyle=color;
  const top=Math.min(y(c.open),y(c.close));
  const bh=Math.max(2,Math.abs(y(c.open)-y(c.close)));
  ctx.fillRect(x-step*.29,top,Math.max(2,step*.58),bh);
 });
 ctx.strokeStyle='#e9edf5';ctx.setLineDash([4,3]);
 ctx.beginPath();ctx.moveTo(left,y(price));ctx.lineTo(w,y(price));ctx.stroke();
 ctx.setLineDash([]);
}
function trade(side){
 const amount=Number(document.getElementById('amount').value);
 const message=document.getElementById('message');
 if(!Number.isFinite(amount)||amount<1){
  message.textContent='Enter a trade amount of at least $1.';return;
 }
 if(amount>balance){
  message.textContent='Insufficient demo balance.';return;
 }
 balance-=amount;
 positions.unshift({
  id:++seq,side,amount,
  symbol:document.getElementById('symbol').value,
  entry:price,opened:new Date().toLocaleTimeString()
 });
 message.textContent=side+' demo position opened. Amount: $'+fmt(amount);
 tab='positions';update();
}
function closeTrade(id){
 const index=positions.findIndex(p=>p.id===id);
 if(index<0)return;
 const p=positions[index];
 const movement=(price-p.entry)/p.entry;
 const direction=p.side==='BUY'?1:-1;
 const pnl=p.amount*movement*direction*100;
 const profit=Math.max(-p.amount,pnl);
 balance+=p.amount+profit;
 history.unshift({...p,exit:price,pnl:profit,closed:new Date().toLocaleTimeString()});
 positions.splice(index,1);
 update();
}
function renderList(){
 const list=document.getElementById('list');
 const items=tab==='positions'?positions:history;
 if(!items.length){
  list.innerHTML='<div class="muted" style="padding:12px 0">'+
  (tab==='positions'?'No open positions yet.':'No closed trades yet.')+'</div>';return;
 }
 list.innerHTML=items.map(p=>{
  if(tab==='positions'){
   return '<div class="item"><div class="row"><strong>'+p.side+' · '+p.symbol+
   '</strong><strong>$'+fmt(p.amount)+'</strong></div><div class="muted">Entry: '+
   p.entry.toFixed(decimals())+' · '+p.opened+'</div><button style="margin-top:8px" onclick="closeTrade('+p.id+')">Close position</button></div>';
  }
  return '<div class="item"><div class="row"><strong>'+p.side+' · '+p.symbol+
  '</strong><strong class="'+(p.pnl>=0?'green':'red')+'">'+(p.pnl>=0?'+':'')+
  '$'+fmt(p.pnl)+'</strong></div><div class="muted">Entry: '+p.entry.toFixed(decimals())+
  ' · Exit: '+p.exit.toFixed(decimals())+' · '+p.closed+'</div></div>';
 }).join('');
}
function showTab(t){tab=t;renderList();}
function resetDemo(){
 if(!confirm('Reset demo balance to $1,000 and clear all trades?'))return;
 balance=1000;positions=[];history=[];seq=0;update();
 document.getElementById('message').textContent='Demo account reset.';
}
function tick(){
 let old=price;
 price+=((Math.random()-.5)*price*.00035);
 if(!candles.length)makeCandles();
 let c=candles[candles.length-1];
 c.close=price;c.high=Math.max(c.high,price);c.low=Math.min(c.low,price);
 update();draw();
}
window.addEventListener('resize',draw);
makeCandles();update();draw();
setInterval(tick,2500);
</script>
</body>
</html>
